name: Package tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    name: PHP ${{ matrix.php }} · Testbench ${{ matrix.testbench }} · ${{ matrix.database }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            testbench: '^10.0'
            database: sqlite
          - php: '8.4'
            testbench: '^10.0'
            database: mysql
          - php: '8.3'
            testbench: '^11.0'
            database: sqlite
          - php: '8.4'
            testbench: '^11.0'
            database: mysql
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: smart_import_test
          MARIADB_USER: smart_import
          MARIADB_PASSWORD: smart_import_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_CONNECTION: ${{ matrix.database }}
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: smart_import_test
      DB_USERNAME: smart_import
      DB_PASSWORD: smart_import_password
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, dom, fileinfo, gd, iconv, intl, mbstring, pdo_mysql, pdo_sqlite, simplexml, xml, xmlreader, xmlwriter, zip
          coverage: none
          tools: composer:v2
      - name: Resolve the selected Laravel generation
        run: composer update --prefer-dist --no-interaction --with-all-dependencies --with "orchestra/testbench:${{ matrix.testbench }}"
      - name: Validate Composer metadata and platform requirements
        run: |
          composer validate --no-check-publish --no-interaction
          composer check-platform-reqs
      - name: Run package and real queue-worker tests
        run: composer test -- --display-skipped
      - name: Check PHP syntax
        run: find src tests database config benchmarks -name '*.php' -print0 | xargs -0 -n1 php -l
